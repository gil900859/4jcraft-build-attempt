name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Added so you can also trigger this manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ca-certificates curl git \
            libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev libpng-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libudev-dev

      - name: Install Meson and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Configure Meson
        run: |
          # Standard release build for CI verification
          meson setup build_meson --wipe --buildtype=release

      - name: Build with Ninja
        run: |
          # -v provides verbose output to debug compilation errors in the log
          ninja -C build_meson -v

      - name: Package build output
        run: |
          # Only packaging the actual binaries/build artifacts, excluding temp files
          tar -czf minecraft-binaries.tar.gz -C build_meson .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-binaries-${{ github.sha }}
          path: minecraft-binaries.tar.gz
          retention-days: 3 # Lower retention for CI builds to save space
