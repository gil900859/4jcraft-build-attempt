name: Build Windows 64 Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson/Ninja
        run: pip install meson ninja

      - name: Configure (Release)
        run: |
          # We only override the standard to 'vc++11' because the source 
          # hardcodes 'gnu++11', which MSVC doesn't recognize.
          meson setup build `
            --buildtype=release `
            -Dcpp_std=vc++11 `
            -Dcmake_prefix_path="C:/vcpkg/installed/x64-windows"

      - name: Build
        run: meson compile -C build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist"
          # Find all binaries/DLLs and move them to the dist folder
          Get-ChildItem -Path "build" -Include "*.exe","*.dll" -Recurse | Copy-Item -Destination "dist"
          # Simple batch launcher for Windows
          "@echo off`nstart Minecraft.Client.exe`n" | Out-File -FilePath "dist\launch.bat" -Encoding ascii

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 4JCraft-Win64-Release
          path: dist/
