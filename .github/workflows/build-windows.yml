name: Build Windows 64 Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson/Ninja
        run: pip install meson ninja

      - name: Configure (Release + Windows Force)
        run: |
          meson setup build `
            --buildtype=release `
            -Dc_args="-D_WIN32 -D_X64 -D_WINDOWS" `
            -Dcpp_args="-D_WIN32 -D_X64 -D_WINDOWS" `
            -Dcmake_prefix_path="C:/vcpkg/installed/x64-windows"

      - name: Build
        run: meson compile -C build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist"
          Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Copy-Item -Destination "dist"
          Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | Copy-Item -Destination "dist"
          "@echo off`nstart Minecraft.Client.exe`n" | Out-File -FilePath "dist\launch.bat" -Encoding ascii

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 4JCraft-Win64-Final
          path: dist/
