name: Build Windows 64 Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove Strawberry Perl
        # This prevents the "Strawberry Perl is broken" error in your logs
        run: |
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $path = ($path.Split(';') | Where-Object { $_ -notlike "*Strawberry*" }) -join ';'
          [Environment]::SetEnvironmentVariable("Path", $path, "Machine")

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Dependencies (vcpkg)
        # Explicitly install GLU to ensure it exists in the vcpkg prefix path
        run: |
          vcpkg install glu:x64-windows

      - name: Install Meson/Ninja
        run: pip install meson ninja

      - name: Configure (Release)
        run: |
          # We use the vcpkg path where we just installed GLU
          meson setup build `
            --buildtype=release `
            -Dcpp_std=vc++11 `
            -Dcmake_prefix_path="C:/vcpkg/installed/x64-windows"

      - name: Build
        run: meson compile -C build

      - name: Package
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" }
          Get-ChildItem -Path "build" -Include "*.exe","*.dll" -Recurse | Copy-Item -Destination "dist"
          "@echo off`nstart Minecraft.Client.exe`n" | Out-File -FilePath "dist\launch.bat" -Encoding ascii

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 4JCraft-Win64-Release
          path: dist/
