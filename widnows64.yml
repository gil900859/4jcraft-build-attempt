name: Build 4JCraft (x64 Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Important if you have client/world submodules

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Meson and Ninja
      run: |
        python -m pip install --upgrade pip
        python -m pip install meson ninja

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup vcpkg
      run: |
        # Use the pre-installed vcpkg on GitHub runners
        vcpkg integrate install
        # If your project needs specific ports, you can install them here:
        # vcpkg install zlib:x64-windows

    - name: Configure Meson
      run: |
        # Using the same "old link" logic from your local setup
        meson setup build `
          --buildtype=release `
          -Dcmake_prefix_path="C:/vcpkg/installed/x64-windows"

    - name: Compile
      run: |
        meson compile -C build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4JCraft-Windows-x64
        path: |
          build/*.exe
          build/*.dll
